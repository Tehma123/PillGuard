[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pillguard"
version = "0.1.0"
description = "Prescription-aware pill checker with a reject option, running fully in the browser"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pyyaml>=6",
    "tqdm>=4.65",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["huggingface_hub>=0.23", "pyarrow>=15"]
dev = ["pytest>=7.4", "ruff>=0.4"]
ddpm = []

[project.scripts]
pillguard = "pillguard.cli:main"

[tool.setuptools.packages.find]
include = ["pillguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that train or download for real (run with `pytest -m slow`)",
    "gpu: tests that need a CUDA device",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "E741", "E731", "B905", "B007", "UP035"]
